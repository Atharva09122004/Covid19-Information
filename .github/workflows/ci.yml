name: CI - PHP Syntax & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: PHP Lint & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, curl, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Syntax Check (Lint) all PHP Files
        run: |
          echo "Scanning all PHP source files for syntax errors..."
          find . -type f -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
          echo "All PHP files passed syntax verification!"

      - name: Verify Documentation Files
        run: |
          test -f README.md && echo "README.md verified"
          test -f sql/database.sql && echo "SQL schema verified"
          test -f tests/master-test-cases.md && echo "Master test cases verified"
          test -f documentation/project-documentation.md && echo "Project documentation verified"
